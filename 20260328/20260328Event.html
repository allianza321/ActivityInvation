<!DOCTYPE html>
<html> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3/28 保戶講座資訊轉發</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px 0; background-color: #f4f7f6; margin: 0; }
        .card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 90%; width: 400px; overflow: hidden; position: relative; }
        .banner-img { width: 100%; display: block; }
        .content { padding: 1.5rem; }
        h2 { color: #003777; margin: 0 0 0.5rem 0; font-size: 1.3rem; }
        .event-title { color: #E67E22; font-size: 1.1rem; font-weight: bold; margin-bottom: 1rem; }
        .msg-box { width: 100%; margin-bottom: 1.2rem; text-align: left; }
        label { font-size: 0.9rem; color: #555; font-weight: bold; display: block; margin-bottom: 5px; }
        textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 0.95rem; resize: none; box-sizing: border-box; }
        .btn-send { width: 100%; padding: 15px; font-size: 1.1rem; background: linear-gradient(135deg, #0056b3 0%, #003777 100%); color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,55,119,0.3); transition: 0.3s; }
        .version-tag { font-size: 10px; color: #ccc; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://github.com/allianza321/ActivityInvation/blob/allianza321-Activity/20260328/20260328_TuYuPing_header6_T.JPG.JPG?raw=true" class="banner-img" alt="Banner">
        <div class="content">
            <h2>安聯人壽保戶講座</h2>
            <div class="event-title">2026年十二星座開運解析</div>
            <div class="msg-box">
                <label for="userMsg">✍️ 想要對好友說的話：</label>
                <textarea id="userMsg" rows="3" placeholder="例如：好久不見！這場講座內容很充實，推薦您來看看～"></textarea>
            </div>
            <button class="btn-send" onclick="sendActivityFlex()">點此選擇好友發送邀請</button>
        </div>
    </div>
    <div class="version-tag">Ver. 15.3.1</div>

    <script>
        const liffId = "2009178037-6FFsbvG7";
        const gasUrl = "https://script.google.com/macros/s/AKfycbwb92t1vnrncidzJ9HHbBJEGjC0hJaQR3Vt2UD8KvPPsAjsZP_ApkMQeJdlJeAitBRCig/exec";
        
        let userName = "未知使用者";
        let userId = "無ID";

        async function initLiff() {
            try {
                await liff.init({ liffId: liffId });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userName = profile.displayName;
                    userId = profile.userId;
                } else { liff.login(); }
            } catch (err) { console.error("LIFF 初始化失敗", err); }
        }

        async function logShareSuccess() {
            const finalUrl = `${gasUrl}?userId=${encodeURIComponent(userId)}&userName=${encodeURIComponent(userName)}&action=${encodeURIComponent("分享成功")}`;
            return fetch(finalUrl, { mode: 'no-cors' });
        }

        async function sendActivityFlex() {
            const customMsg = document.getElementById('userMsg').value;
            const calendarUrl = "https://www.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent("【安聯人壽】2026年十二星座開運解析") + "&dates=20260328T010000Z/20260328T040000Z";
            const mapUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent("安聯人壽 宏國通訊處");
            const applyUrl = "https://docs.google.com/forms/d/e/1FAIpQLSfwNIB1dN8B1A-BIqAjxtzlIO4fUP_LAs-6_29t5TPI5Fpndg/viewform";
            
            // 更新：連結的大圖更換為 Allianz CS_DM03.JPG
            const detailImgUrl = "https://github.com/allianza321/ActivityInvation/blob/allianza321-Activity/20260328/20260328_Allianz%20CS_DM03.JPG?raw=true";

            const messages = [
                {
                    "type": "flex",
                    "altText": "您收到一份來自 宏國通訊處 的活動熱情邀約！",
                    "contents": {
                        "type": "bubble",
                        "hero": { 
                            "type": "image", 
                            "url": "https://github.com/allianza321/ActivityInvation/blob/allianza321-Activity/20260328/20260328_TuYuPing_header7.JPG?raw=true", 
                            "size": "full", "aspectRatio": "20:13", "aspectMode": "cover",
                            "action": { "type": "uri", "uri": detailImgUrl } 
                        },
                        "body": {
                            "type": "box", "layout": "vertical", "contents": [
                                { "type": "text", "text": "安聯人壽保戶講座", "weight": "bold", "size": "xl" },
                                { "type": "text", "text": "2026年十二星座開運解析", "size": "md", "color": "#E67E22", "weight": "bold", "margin": "sm" },
                                { "type": "box", "layout": "vertical", "margin": "xl", "spacing": "lg", "contents": [
                                    { "type": "box", "layout": "baseline", "spacing": "sm", "action": { "type": "uri", "uri": calendarUrl }, "contents": [ { "type": "text", "text": "時間", "color": "#aaaaaa", "size": "sm", "flex": 1 }, { "type": "text", "text": "2026/3/28(六) 09:00 - 12:00", "wrap": true, "color": "#0056b3", "size": "sm", "flex": 5, "decoration": "underline" } ] },
                                    { "type": "box", "layout": "baseline", "spacing": "sm", "action": { "type": "uri", "uri": mapUrl }, "contents": [ { "type": "text", "text": "地點", "color": "#aaaaaa", "size": "sm", "flex": 1 }, { "type": "text", "text": "台北市信義區基隆路二段51號10樓之二(宏國通訊處)", "wrap": true, "color": "#0056b3", "size": "sm", "flex": 5, "decoration": "underline" } ] }
                                ]}
                            ]
                        },
                        "footer": { 
                            "type": "box", "layout": "vertical", "spacing": "sm", "contents": [ 
                                { "type": "button", "style": "link", "height": "sm", "action": { "type": "uri", "label": "即刻報名", "uri": applyUrl } }, 
                                { "type": "button", "style": "link", "height": "sm", "action": { "type": "uri", "label": "分享好友", "uri": `https://liff.line.me/${liffId}` } } 
                            ] 
                        }
                    }
                }
            ];

            if (customMsg.trim() !== "") {
                messages.push({ "type": "text", "text": customMsg });
            }

            if (liff.isApiAvailable('shareTargetPicker')) {
                try {
                    const result = await liff.shareTargetPicker(messages);
                    if (result) {
                        await logShareSuccess(); 
                        liff.closeWindow();
                    }
                } catch (error) { console.error(error); }
            }
        }
        initLiff();
    </script>
</body>
</html>
